name: Windows VM acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winix-workstation
  cancel-in-progress: false
jobs:
  windows-vm:
    runs-on: [self-hosted, Linux, X64, winix]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build
      - run: ./winix doctor
      - run: ./winix ci --config examples/acceptance.yaml --output artifacts/runs --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: artifacts/runs
